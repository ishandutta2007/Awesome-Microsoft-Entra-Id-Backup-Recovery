<svg fill="none" viewBox="0 0 1200 360" width="100%" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c1e" />
      <stop offset="50%" stop-color="#0c1736" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="azure-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078d4" />
      <stop offset="100%" stop-color="#00c8ff" />
    </linearGradient>

    <linearGradient id="neon-cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#00f5a0" />
    </linearGradient>

    <linearGradient id="purple-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>

    <radialGradient id="glow-circle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0078d4" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0078d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purple-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>

    <!-- Card Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 16px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #e2e8f0;
      letter-spacing: 0.5px;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 11px;
      fill: #38bdf8;
      letter-spacing: 1px;
    }

    /* Dynamic / Animated elements behind text */
    @keyframes pulse-ring {
      0% { r: 55px; opacity: 0.8; }
      50% { r: 90px; opacity: 0.2; }
      100% { r: 55px; opacity: 0.8; }
    }
    @keyframes rotate-radar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes float-chip-1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes float-chip-2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dash-flow {
      to { stroke-dashoffset: -80; }
    }
    @keyframes shield-glow {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 10px #0078d4); }
      50% { opacity: 1; filter: drop-shadow(0 0 25px #00f5a0); }
    }

    .radar-beam {
      transform-origin: 1040px 180px;
      animation: rotate-radar 12s linear infinite;
    }
    .pulse-c1 {
      animation: pulse-ring 4s ease-in-out infinite;
    }
    .pulse-c2 {
      animation: pulse-ring 4s ease-in-out infinite 2s;
    }
    .chip-1 {
      animation: float-chip-1 5s ease-in-out infinite;
    }
    .chip-2 {
      animation: float-chip-2 6s ease-in-out infinite;
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: dash-flow 3s linear infinite;
    }
    .shield-icon {
      animation: shield-glow 4s ease-in-out infinite;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Subtle Pattern Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Backgrounds (Depth Layer) -->
  <circle cx="150" cy="80" r="180" fill="url(#purple-glow)" />
  <circle cx="1040" cy="180" r="220" fill="url(#glow-circle)" />
  <circle cx="600" cy="300" r="160" fill="url(#glow-circle)" opacity="0.3" />

  <!-- Dynamic Background Geometric Flows (Placed behind foreground text) -->
  <g opacity="0.45">
    <!-- Curved Data Pipeline 1 -->
    <path class="flow-line" d="M -20 280 Q 250 200 480 300 T 900 240 T 1220 290" fill="none" stroke="#0078d4" stroke-width="2.5" />
    <!-- Curved Data Pipeline 2 -->
    <path class="flow-line" d="M -20 100 Q 300 160 620 90 T 1100 120 T 1220 80" fill="none" stroke="#00f5a0" stroke-width="1.8" />
  </g>

  <!-- Dynamic Radar / Recovery Node in Right Foreground Graphic Area -->
  <g transform="translate(1030, 180)">
    <!-- Concentric radar circles -->
    <circle cx="0" cy="0" r="120" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="4 4" fill="none" opacity="0.4"/>
    <circle cx="0" cy="0" r="85" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="6 6" fill="none" opacity="0.6"/>
    <circle cx="0" cy="0" r="55" stroke="#38bdf8" stroke-width="1.5" fill="none" class="pulse-c1"/>
    <circle cx="0" cy="0" r="35" stroke="#00f5a0" stroke-width="2" fill="none" class="pulse-c2"/>

    <!-- Rotating radar sweep beam -->
    <g class="radar-beam" transform="translate(-1030, -180)">
      <path d="M 1030 180 L 1150 140 A 120 120 0 0 1 1150 220 Z" fill="url(#azure-blue)" opacity="0.18" />
    </g>

    <!-- Center Resilience Core / Shield -->
    <circle cx="0" cy="0" r="28" fill="#0b192c" stroke="#38bdf8" stroke-width="2.5" />
    <g class="shield-icon" transform="translate(-14, -15) scale(0.9)">
      <!-- Security Shield Path -->
      <path d="M15 2 L4 7 V15 C4 22 15 28 15 28 C15 28 26 22 26 15 V7 L15 2 Z" fill="url(#azure-blue)" stroke="#38bdf8" stroke-width="1.5" />
      <path d="M11 15 L14 18 L20 11" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
  </g>

  <!-- Floating Dynamic Feature Chips on right side -->
  <g class="chip-1" transform="translate(860, 68)">
    <rect width="180" height="42" rx="10" fill="#0f172a" stroke="#0078d4" stroke-width="1.2" filter="url(#shadow)" opacity="0.95"/>
    <circle cx="22" cy="21" r="7" fill="#00f5a0" />
    <text x="38" y="26" class="tag-text">Instant AD Rollback</text>
  </g>

  <g class="chip-2" transform="translate(880, 252)">
    <rect width="185" height="42" rx="10" fill="#0f172a" stroke="#7928ca" stroke-width="1.2" filter="url(#shadow)" opacity="0.95"/>
    <circle cx="22" cy="21" r="7" fill="#ff0080" />
    <text x="38" y="26" class="tag-text">Immutable Directory</text>
  </g>

  <!-- FOREGROUND TEXT SECTION (Clear, perfectly legible, never obscured) -->
  <g transform="translate(70, 75)">
    <!-- Top Super-Badge Pill -->
    <g transform="translate(0, 0)">
      <rect width="265" height="28" rx="14" fill="#0e223d" stroke="#0284c7" stroke-width="1.2" />
      <circle cx="16" cy="14" r="5" fill="#38bdf8" />
      <text x="30" y="18" class="badge-label">ENTERPRISE IDENTITY RESILIENCE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="72" class="title-text">
      Awesome Microsoft Entra ID
    </text>
    <text x="0" y="118" class="title-text" fill="url(#azure-blue)">
      Backup &amp; Disaster Recovery
    </text>

    <!-- Subtitle / Meta Description -->
    <text x="0" y="156" class="subtitle-text">
      Curated directory of SaaS resilience suites, forest recovery engines, and open-source
    </text>
    <text x="0" y="180" class="subtitle-text">
      PowerShell tools for Azure AD, Conditional Access, PIM, and tenant disaster recovery.
    </text>

    <!-- Visual Feature Badges along bottom of text area -->
    <g transform="translate(0, 215)">
      <!-- Badge 1: SaaS Protection -->
      <g transform="translate(0, 0)">
        <rect width="135" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" class="tag-text">☁️ SaaS Solutions</text>
      </g>

      <!-- Badge 2: Open Source -->
      <g transform="translate(145, 0)">
        <rect width="145" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" class="tag-text">⚡ Open Source Tools</text>
      </g>

      <!-- Badge 3: Forest Recovery -->
      <g transform="translate(300, 0)">
        <rect width="150" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" class="tag-text">🛡️ Forest Recovery</text>
      </g>

      <!-- Badge 4: Zero Trust / PIM -->
      <g transform="translate(460, 0)">
        <rect width="155" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" class="tag-text">🔒 PIM &amp; Zero Trust</text>
      </g>
    </g>
  </g>

  <!-- Sleek Border Accent -->
  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="15.25" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35" />
</svg>
